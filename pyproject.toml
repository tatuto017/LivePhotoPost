[project]
name = "live-photo-post"
version = "0.1.0"
description = "ライブ撮影写真を X (Twitter) に自動投稿するツール"
requires-python = ">=3.13"
dependencies = [
    "tweepy>=4.14",
    "python-dotenv>=1.0",
    "pillow>=11.0",
    "httpx>=0.27",
    "icalendar>=6.0",
    "python-dateutil>=2.9",
]

[project.scripts]
live-photo-post = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]
